name: Sync Social & GitHub Data

on:
  # Run every 24 hours at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Also run when social_posts.json is updated (push to main)
  push:
    branches: [main]
    paths:
      - 'data/social_posts.json'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/fetch_github.py

      - name: Process social posts
        run: python scripts/process_social.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Portfolio Bot"
          git config user.email "bot@portfolio.local"
          git add data/
          git commit -m "🔄 Auto-sync: Update GitHub data and social feed [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
